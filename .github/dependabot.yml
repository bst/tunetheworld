# Opens pull requests for outdated dependencies once a week. CI checks each of them like any other pull request.
version: 2
updates:
  # Libraries and plugins in gradle/libs.versions.toml, and the Gradle wrapper
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    # One pull request for all minor and patch updates instead of one per library; major updates come separately
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  # Action versions in .github/workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

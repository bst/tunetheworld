# Runs on every pull request and push to main:
# - checks: the same checks as the git hooks, plus an APK build
# - emulator: smoke tests on an emulator at minSdk and targetSdk
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to the same pull request cancels the run that is still going.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Matches toolchainVersion in gradle/gradle-daemon-jvm.properties.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # Caches Gradle dependencies and build data, and validates the Gradle wrapper.
      # Only runs on main write to this cache; pull requests just read it.
      - uses: gradle/actions/setup-gradle@v6

      # Instrument recordings for SampleValidationTest (about 170 MB, see README "Tests").
      # setup-gradle does not cache this custom directory. Without it, every run downloads
      # the files from the University of Iowa server and fails when that server is down.
      - name: Cache instrument recordings
        uses: actions/cache@v6
        with:
          path: ~/.gradle/caches/tunetheworld-samples
          key: samples-${{ hashFiles('app/src/test/resources/samples.tsv') }}

      - name: Check and build
        run: ./gradlew --continue :app:ktlintCheck :app:lintDebug :app:testDebugUnitTest :app:assembleDebug

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: app/build/reports
          retention-days: 14

  # Starts the app on an emulator and runs the smoke tests in app/src/androidTest.
  # The emulator's microphone is silent, so these cover startup, the permission flow and the UI;
  # pitch accuracy is covered by SampleValidationTest in the checks job.
  emulator:
    name: emulator (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # minSdk. There is no lightweight ATD image this old, so this uses the default image.
          - api-level: 26
            target: default
          # targetSdk, with the ATD image made for automated tests
          - api-level: 36
            target: aosp_atd
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # Hardware acceleration for the emulator; without it, it is too slow to be usable
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Always a cold boot (-no-snapshot). A snapshot cached by an earlier run saves only 5–25 s,
      # and the API 26 emulator restored from one went offline before the tests could start.
      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: x86_64
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: emulator-reports-api-${{ matrix.api-level }}
          path: |
            app/build/reports/androidTests
            app/build/outputs/androidTest-results
          retention-days: 14
